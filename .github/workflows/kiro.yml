name: Kiro integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kiro:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --test kiro --locked
      - run: python -m unittest discover -s tests -p test_stack.py
      - run: python -m pip install -r scripts/requirements-kiro.lock
      - run: python -m pytest tests/unit/test_main_cli.py tests/unit/test_routes_anthropic.py -q
        working-directory: vendor/kiro-gateway
